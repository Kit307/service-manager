[package]
name = "service-manager"
version = "0.8.2"
edition = "2021"
rust-version = "1.88"

[lib]
name = "service_manager"
path = "src/lib.rs"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-liquid-glass", "dep:tauri-build"]

[dependencies]
tauri = { version = "2", optional = true, features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-liquid-glass = { version = "=0.1.6", optional = true }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
nix = { version = "0.30", features = ["signal", "process"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
reqwest_mcp = { package = "reqwest", version = "0.13", default-features = false }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
axum = "0.8"
getrandom = "0.3"
subtle = "2"

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
